<!doctype html>
<meta charset="utf-8">
<title>Ступени — демо-прогресс</title>
<!-- Заполняет прогресс правдоподобными данными и открывает приложение: shot.html?v=stats&theme=dark&run=1 -->
<script src="../js/content/a1.js"></script>
<script src="../js/content/a2.js"></script>
<script>
  const q = new URLSearchParams(location.search), DAY = 864e5, now = Date.now();
  const dk = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const S = { v: 1, onboarded: true, level: 'a2', goal: 20, accent: 'en-US', rate: 0.9, theme: q.get('theme') || 'auto', lessons: {}, cards: {}, days: {}, wrong: {}, tests: [], reads: {}, mist: {}, xp: 1240 };
  const done = [...COURSE.a1, COURSE.a2[0]];
  done.forEach((l, i) => {
    const t = now - (done.length - i) * 4 * DAY;
    S.lessons[l.id] = { done: t, last: t, n: 1, best: [100, 80, 100, 60, 80, 100, 80][i], stars: [3, 2, 3, 2, 2, 3, 2][i] };
    l.words.forEach((w, k) => (S.cards[w[0]] = { en: w[0], ru: w[1], ex: w[2], exr: w[3], tip: w[4], l: l.id, box: Math.max(0, 5 - i + (k % 3) - 1), due: k % 4 === 0 ? now - 1000 : now + (k + 1) * DAY, n: 3, lap: 0, add: t }));
  });
  for (let i = 0; i < 60; i++) {
    const d = new Date(now - i * DAY); const r = (i * 7919) % 13;
    if (i > 40 && r < 6) continue; if (r === 3 && i > 1) continue;
    S.days[dk(d)] = { sec: i === 0 ? 840 : (5 + ((i * 37) % 32)) * 60, xp: 40, ok: 20 + (i % 9), bad: 3 + (i % 4), cards: 10, les: i % 4 === 0 ? 1 : 0 };
  }
  S.mist = { 'a1-3': 7, 'a1-4': 4, 'a2-1': 3 };
  S.wrong = { 'a1-3|5': { n: 2, t: now }, 'a1-4|2': { n: 1, t: now }, 'a2-1|6': { n: 1, t: now } };
  S.tests = [{ t: now - 14 * DAY, ok: 7, n: 10 }, { t: now - 7 * DAY, ok: 9, n: 10 }];
  S.reads = { 'r-a1-1': { t: now - 3 * DAY, ok: 5, n: 6 } };
  localStorage.setItem('stupeni.v1', JSON.stringify(S));
  localStorage.removeItem('stupeni.run.v1');
  if (q.get('fresh')) localStorage.clear();
  location.replace('../index.html#' + (q.get('v') || 'home'));
</script>
